<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Navi 标签整理工具</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2b3038; --text: #e6e8ec;
    --muted: #8b93a1; --accent: #4a9eff; --ok: #3ecf8e; --warn: #f5a623; --danger: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Microsoft YaHei", system-ui, sans-serif; }

  header { position: sticky; top: 0; z-index: 10; background: var(--panel);
           border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }

  input[type=text] { flex: 1; min-width: 220px; background: #101318; color: var(--text);
                     border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
  input[type=text]:focus { outline: none; border-color: var(--accent); }

  button { background: #262b33; color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 7px 13px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: #313842; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.leak { background: var(--warn); border-color: var(--warn); color: #201800; font-weight: 700; }
  button.crack { background: #a05cf5; border-color: #a05cf5; color: #fff; font-weight: 700; }
  button.censor { background: #4d5561; border-color: #4d5561; color: #fff; }

  .chip { background: #262b33; border: 1px solid var(--line); border-radius: 999px;
          padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .muted { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; }

  #wall { display: grid; gap: 10px; padding: 14px 16px 120px;
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

  .card { position: relative; background: var(--panel); border: 2px solid transparent;
          border-radius: 8px; overflow: hidden; cursor: pointer; user-select: none; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,158,255,.25); }
  .card.hint { border-color: var(--warn); }
  /* 海报上一律不加任何遮挡 —— 字幕/流出/破解的角标本来就印在图上，
     挡住了就等于把要判断的依据盖掉了。状态一律放到图片下面。 */
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #0c0e11; }
  .card .noimg { width: 100%; aspect-ratio: 2/3; display: grid; place-items: center;
                 color: var(--muted); font-size: 12px; background: #0c0e11; }

  .bar { font-size: 11px; font-weight: 700; text-align: center; padding: 3px 4px; }
  .t-有码 { background: #4d5561; color: #fff; }
  .t-无码破解 { background: #a05cf5; color: #fff; }
  .t-无码流出 { background: var(--warn); color: #201800; }
  .t-none { background: var(--danger); color: #fff; }

  .card .meta { padding: 4px 7px 6px; font-size: 11px; line-height: 1.35; }
  .card .code { font-weight: 700; letter-spacing: .3px; }
  .card .name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .guess { color: var(--warn); font-weight: 700; }

  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
           border-top: 1px solid var(--line); padding: 10px 16px; display: flex;
           gap: 8px; align-items: center; flex-wrap: wrap; }
  #log { max-height: 90px; overflow: auto; font-size: 12px; color: var(--muted);
         padding: 0 16px; }
  .err { color: var(--danger); }
  kbd { background: #0c0e11; border: 1px solid var(--line); border-radius: 4px;
        padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>

<header>
  <div class="row">
    <input type="text" id="root" placeholder="媒体库根目录，多个用 ; 隔开，例如 L:\艾薇;M:\影片">
    <button id="browse">浏览…</button>
    <button id="scan" class="primary">扫描</button>
  </div>
  <div class="row">
    <span class="muted">筛选</span>
    <span class="chip" data-filter="suspect">待确认（文件名像破解）</span>
    <span class="chip on" data-filter="有码">标了有码</span>
    <span class="chip" data-filter="无码破解">无码破解</span>
    <span class="chip" data-filter="无码流出">无码流出</span>
    <span class="chip" data-filter="none">没有码类标签</span>
    <span class="chip" data-filter="all">全部</span>
    <input type="text" id="search" placeholder="搜番号或标题" style="max-width:200px">
    <span class="grow"></span>
    <span class="muted" id="counts">还没扫描</span>
  </div>
</header>

<div id="log"></div>
<div id="wall"></div>

<footer>
  <button id="selAll">全选当前</button>
  <button id="selNone">取消选择</button>
  <span class="muted" id="selInfo">已选 0 部</span>
  <span class="grow"></span>
  <span class="muted">快捷键 <kbd>1</kbd>有码 <kbd>2</kbd>破解 <kbd>3</kbd>流出 <kbd>0</kbd>清除</span>
  <button class="censor" data-apply="有码" disabled>设为有码</button>
  <button class="crack" data-apply="无码破解" disabled>设为无码破解</button>
  <button class="leak" data-apply="无码流出" disabled>设为无码流出</button>
  <button data-apply="" disabled>清除码类标签</button>
</footer>

<script>
let items = [];
let filter = '有码';
let keyword = '';
const selected = new Set();
let lastIndex = -1;
let view = [];

const $ = (id) => document.getElementById(id);
const wall = $('wall');

function log(message, isError) {
  const line = document.createElement('div');
  if (isError) line.className = 'err';
  line.textContent = message;
  $('log').prepend(line);
}

function matchesFilter(item) {
  if (filter === 'all') return true;
  if (filter === 'suspect') return !!item.guess;
  if (filter === 'none') return !item.status;
  return item.status === filter;
}

function render() {
  view = items.filter((item) => {
    if (!matchesFilter(item)) return false;
    if (!keyword) return true;
    const text = (item.code + ' ' + item.title).toLowerCase();
    return text.includes(keyword);
  });

  wall.innerHTML = '';
  const fragment = document.createDocumentFragment();

  view.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card' + (selected.has(item.id) ? ' sel' : '') + (item.guess ? ' hint' : '');
    card.dataset.index = index;

    const image = item.has_poster
      ? `<img loading="lazy" src="/thumb?id=${item.id}" alt="">`
      : `<div class="noimg">无封面</div>`;
    const bar = item.status
      ? `<div class="bar t-${item.status}">${item.status}</div>`
      : `<div class="bar t-none">未标码类</div>`;
    const guess = item.guess ? `<div class="guess">文件名像${item.guess}</div>` : '';

    card.innerHTML = image + bar +
      `<div class="meta"><div class="code">${escapeHTML(item.code)}</div>` +
      `<div class="name" title="${escapeHTML(item.title)}">${escapeHTML(item.title)}</div>` +
      guess + `</div>`;
    fragment.appendChild(card);
  });

  wall.appendChild(fragment);
  updateCounts();
}

function escapeHTML(value) {
  return String(value || '').replace(/[&<>"]/g, (char) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
}

function updateCounts() {
  const total = items.length;
  const byStatus = (status) => items.filter((item) => item.status === status).length;
  $('counts').textContent =
    `共 ${total} 部 · 有码 ${byStatus('有码')} · 破解 ${byStatus('无码破解')} · ` +
    `流出 ${byStatus('无码流出')} · 未标 ${items.filter((i) => !i.status).length} · ` +
    `待确认 ${items.filter((i) => i.guess).length} ｜ 当前显示 ${view.length}`;
  $('selInfo').textContent = `已选 ${selected.size} 部`;
  document.querySelectorAll('[data-apply]').forEach((button) => {
    button.disabled = selected.size === 0;
  });
}

wall.addEventListener('click', (event) => {
  const card = event.target.closest('.card');
  if (!card) return;
  const index = Number(card.dataset.index);
  const item = view[index];

  if (event.shiftKey && lastIndex >= 0) {
    const [from, to] = index < lastIndex ? [index, lastIndex] : [lastIndex, index];
    for (let i = from; i <= to; i++) selected.add(view[i].id);
  } else {
    selected.has(item.id) ? selected.delete(item.id) : selected.add(item.id);
    lastIndex = index;
  }
  render();
});

$('browse').onclick = async () => {
  const response = await fetch('/api/pick');
  const data = await response.json();
  if (!data.path) return;
  const box = $('root');
  box.value = box.value.trim() ? box.value.trim() + ';' + data.path : data.path;
};

$('scan').onclick = async () => {
  const roots = $('root').value.split(';').map((value) => value.trim()).filter(Boolean);
  if (!roots.length) return log('请先填一个目录', true);

  $('scan').disabled = true;
  $('scan').textContent = '扫描中…';
  try {
    const response = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ roots }),
    });
    const data = await response.json();
    if (data.error) { log(data.error, true); return; }
    items = data.items || [];
    selected.clear();
    lastIndex = -1;
    log(`扫描完成，找到 ${items.length} 部（缩略图正在后台生成，前几秒可能有空白）`);
    render();
  } catch (error) {
    log('扫描失败: ' + error.message, true);
  } finally {
    $('scan').disabled = false;
    $('scan').textContent = '扫描';
  }
};

document.querySelectorAll('.chip').forEach((chip) => {
  chip.onclick = () => {
    document.querySelectorAll('.chip').forEach((other) => other.classList.remove('on'));
    chip.classList.add('on');
    filter = chip.dataset.filter;
    lastIndex = -1;
    render();
  };
});

$('search').oninput = (event) => {
  keyword = event.target.value.trim().toLowerCase();
  lastIndex = -1;
  render();
};

$('selAll').onclick = () => { view.forEach((item) => selected.add(item.id)); render(); };
$('selNone').onclick = () => { selected.clear(); lastIndex = -1; render(); };

async function apply(status) {
  if (!selected.size) return;
  const ids = [...selected];
  document.querySelectorAll('[data-apply]').forEach((button) => (button.disabled = true));

  try {
    const response = await fetch('/api/apply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids, status }),
    });
    const results = await response.json();

    let ok = 0;
    results.forEach((result) => {
      if (result.ok) {
        ok++;
        const item = items.find((entry) => entry.id === result.id);
        if (item) { item.status = status; item.tags = result.tags; item.guess = ''; }
      } else {
        log(`失败: ${result.error}`, true);
      }
    });
    log(`已写入 ${ok} 个 NFO：${status || '清除码类标签'}`);
    selected.clear();
    lastIndex = -1;
    render();
  } catch (error) {
    log('写入失败: ' + error.message, true);
  }
}

document.querySelectorAll('[data-apply]').forEach((button) => {
  button.onclick = () => apply(button.dataset.apply);
});

document.addEventListener('keydown', (event) => {
  if (event.target.tagName === 'INPUT') return;
  if (event.ctrlKey && event.key === 'a') { event.preventDefault(); $('selAll').click(); return; }
  if (event.key === 'Escape') { $('selNone').click(); return; }
  const map = { '1': '有码', '2': '无码破解', '3': '无码流出', '0': '' };
  if (event.key in map) { event.preventDefault(); apply(map[event.key]); }
});

fetch('/api/state').then((response) => response.json()).then((data) => {
  if (data.roots && data.roots.length) $('root').value = data.roots.join(';');
  items = data.items || [];
  render();
});
</script>
</body>
</html>
